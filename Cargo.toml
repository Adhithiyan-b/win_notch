[workspace]
resolver = "2"
members = ["crates/poni-core", "crates/studio-diorama", "crates/poni"]

[workspace.package]
version = "0.2.30"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Libraries that run for moments and never in a frame, built for size instead
# of speed (AGENTS.md, Keep it light): the Japanese dictionary's tokenizer and unpacker, JSON
# and QR codes. Poni's own code keeps opt-level 3.
[profile.release.package.vibrato]
opt-level = "s"
[profile.release.package.ruzstd]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
[profile.release.package.qrcodegen]
opt-level = "s"
# The Diorama theme's picture (crates/studio-diorama): painted once a minute
# while the pill rests, and for the moment its glass ball rolls at sunrise
# and sunset.
[profile.release.package.studio-diorama]
opt-level = "s"
